name: CI

# Corre en cada push y en cada PR. El objetivo es que typecheck, tests y build
# dejen de depender de que alguien se acuerde de ejecutarlos.
on:
  push:
    branches: ['**']
  pull_request:

# Si llegan varios push seguidos a la misma rama, solo interesa el último.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        # Variables de relleno: el build no habla con Supabase, pero el cliente
        # falla al arrancar si faltan, y eso es deliberado.
        env:
          VITE_SUPABASE_URL: https://ejemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: clave-de-relleno-para-el-build
        run: npm run build
